<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Signup Page</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    html, body {
      height: 100%; margin: 0; padding: 0; overflow: hidden;
    }
    body {
      background: rgba(18, 18, 18, 0.98);
      width: 100vw; height: 100vh;
      font-family: 'Segoe UI', Arial, sans-serif;
      display: flex; align-items: center; justify-content: center;
    }
    #grid-bg { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 0; pointer-events: none;}
    #branch-svg {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 370px;
      height: 65px;
      z-index: 10;
      pointer-events: none;
    }
    #rope-canvas {
      position: absolute;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      z-index: 18;
      pointer-events: none;
    }
    .signup-container {
      position: absolute;
      left: 50%; top: 46%;
      transform: translate(-50%, -50%);
      width: 400px;
      padding: 38px 28px;
      border-radius: 20px;
      background: rgba(24,24,24,0.87);
      border: 2px solid transparent;
      box-shadow: 0 8px 32px 0 rgba(31,38,135,.27), 0 0 10px 2px #4ade80cc;
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 20;
      border-top-left-radius: 17px;
      border-top-right-radius: 17px;
      animation: glowPulse 2.1s infinite alternate;
    }
    @keyframes glowPulse {
      0%   { box-shadow: 0 8px 32px 0 rgba(31,38,135,.27), 0 0 5px 2px #4ade8066;}
      100% { box-shadow: 0 8px 32px 0 rgba(31,38,135,.27), 0 0 20px 6px #22d3ee;}
    }
    form {
      width: 380px;
      background: transparent;
      border-radius: 20px;
      padding: 0 28px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
    }
    h2 {
      color: #fff; margin-bottom: 28px; text-align: center;
      font-weight: 600; letter-spacing: 1px;
    }
    .signup-options {
      display: flex; justify-content: center; margin-bottom: 22px; gap: 12px;
    }
    .option-btn {
      background: #181818; color: #dadada;
      border: 1.5px solid #222; border-radius: 8px 8px 0 0;
      padding: 8px 18px; font-size: 15px;
      cursor: pointer; outline: none;
      transition: background .2s, color .2s, box-shadow .3s;
      box-shadow: none;
    }
    .option-btn.active {
      background: #4ade80;
      color: #111;
      border-bottom: 2.5px solid #4ade80;
      font-weight: bold;
      box-shadow: 0 2px 12px #22d3ee44;
    }
    .input-group {
      margin-bottom: 22px; display: flex; flex-direction: column;
      opacity: 1; transition: opacity 0.32s;
    }
    .input-group.hide {
      opacity: 0;
      pointer-events: none;
      height: 0;
      margin: 0;
      overflow: hidden;
    }
    .input-group label { color: #dadada; font-size: 14px; margin-bottom: 6px; font-weight: 500; }
    .input-group input {
      padding: 11px 14px; border-radius: 8px;
      border: 1px solid #272727; background: #141414; color: #fff;
      font-size: 16px; outline: none; transition: border .2s, box-shadow .2s;
    }
    .input-group input:focus {
      border: 1.5px solid #4ade80;
      box-shadow: 0 2px 8px #22d3ee55;
      transform: scale(1.04);
    }
    .input-group input.valid {
      border: 1.8px solid #4ade80 !important;
      background: #172c1f;
      box-shadow: 0 0 8px #4ade8069;
    }
    .input-group input.invalid {
      border: 1.8px solid #ff4454 !important;
      background: #2a151e;
      animation: shake 0.25s linear;
    }
    @keyframes shake {
      0% { transform: translateX(0);}
      30% { transform: translateX(-7px);}
      60% { transform: translateX(6px);}
      100% { transform: translateX(0);}
    }
    .password-wrapper {
      position: relative; display: flex; align-items: center;
    }
    .toggle-password {
      position: absolute; right: 11px; top: 9px;
      cursor: pointer;
      background: none;
      color: #70f5d3;
      font-size: 1.05em;
      border: none;
      z-index: 2;
      transition: color 0.20s;
    }
    .toggle-password:hover { color: #d4ba4d; }
    .strength-meter {
      width: 100%; height: 6px; border-radius: 4px;
      margin-top: 5px;
      background: #232323;
      overflow: hidden;
      box-shadow: 0 0 5px #129fa2;
    }
    .strength-bar {
      height: 100%; transition: width 0.35s;
      background: linear-gradient(90deg,#ff4d79,#efab35,#becb28,#43e85c,#30d3ea);
    }
    .strength-text {
      font-size: 13px; margin-top: 2px; color: #8de4c7; font-weight: 500;
    }
    .signup-btn {
      width: 100%; padding: 13px 0; border: none; border-radius: 8px;
      font-weight: bold; font-size: 17px;
      background: linear-gradient(100deg, #4ade80 60%, #22d3ee 100%);
      color: #000; cursor: pointer; transition: box-shadow .2s, filter .19s;
      box-shadow: 0 2px 6px #22d3ee33;
      filter: brightness(1);
      position: relative;
      overflow: hidden;
    }
    .signup-btn::after {
      content: '';
      position: absolute; top: 0; left: -100%; height: 100%; width: 250%;
      background: linear-gradient(120deg, #55fbef77 12%, #e8f95122 85%);
      opacity: 0.15; pointer-events: none;
      transition: left 0.33s;
    }
    .signup-btn:active {
      filter: brightness(0.98);
    }
    .signup-btn:hover { box-shadow: 0 6px 24px #22d3ee77; }
    .signup-btn:hover::after {
      left: 0;
    }
    .popup { display: none; position: fixed; z-index: 30; left: 0; top: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.33); align-items: center; justify-content: center; animation: fade-in 0.33s; }
    .popup.show {
      display: flex; animation: fade-in 0.2s;
    }
    @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
    .popup-content {
      background: #181818; color: #fff;
      border-radius: 14px; padding: 32px 20px 18px 20px;
      text-align: center; min-width: 240px;
      box-shadow: 0 8px 32px 0 rgba(31,38,135,.37);
    }
    #popup-ok-btn {
      margin-top: 16px; padding: 8px 22px; border-radius: 7px; border: none;
      background: #4ade80; color: #000;
      font-weight: bold; font-size: 15px;
      cursor: pointer; transition: background .2s;
    }
    #popup-ok-btn:hover { background: #22d3ee; }
    @media (max-width: 450px) {
      .signup-container, form { width: 98vw !important; padding: 14vw 2vw !important;}
    }
    /* Add to your CSS */
.cursor-dot {
  position: fixed;
  pointer-events: none;
  width: 13px;
  height: 13px;
  border-radius: 50%;
  background: linear-gradient(90deg,#4ade80,#22d3ee);
  opacity: 0.50;
  transform: scale(1);
  z-index: 9999;
  animation: dot-fade 0.7s forwards;
}
@keyframes dot-fade {
  100% {
    opacity: 0;
    transform: scale(2.1);
  }
}

  </style>
</head>
<body>
  <!-- Add this inside your <body> -->
<div id="cursor-trail-root"></div>

  <canvas id="grid-bg"></canvas>
  <!-- Branch SVG at the top -->
  <svg id="branch-svg" viewBox="0 0 370 65" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M15 28 Q90 12, 185 25 Q270 38, 355 18" stroke="#36210c" stroke-width="16" stroke-linecap="round"/>
    <ellipse cx="355" cy="20" rx="12" ry="7" fill="#36210c"/>
    <ellipse cx="15" cy="29" rx="12" ry="9" fill="#36210c"/>
    <ellipse cx="82" cy="14" rx="8" ry="5.3" fill="#443b19"/>
    <ellipse cx="255" cy="33" rx="15" ry="7" fill="#443b19"/>
    <ellipse cx="110" cy="18" rx="10" ry="4.8" fill="#5bf179" transform="rotate(-2 110 18)"/>
    <ellipse cx="335" cy="13" rx="12" ry="6.5" fill="#a6e773" transform="rotate(8 335 13)"/>
  </svg>
  <!-- Wavy ropes and grommets -->
  <canvas id="rope-canvas"></canvas>
  <div class="signup-container" id="signup-container">
    <form id="signup-form" autocomplete="off">
      <h2>Sign up</h2>
      <div class="signup-options">
        <button type="button" class="option-btn active" id="email-opt">Email</button>
        <button type="button" class="option-btn" id="mobile-opt"> Mobile Number</button>
      </div>
      <div class="input-group" id="name-group">
        <label for="name">Enter Name</label>
        <input type="text" id="name" required autocomplete="off" />
      </div>
      <div class="input-group" id="email-group">
        <label for="email">Enter Email</label>
        <input type="email" id="email" autocomplete="off" />
      </div>
      <div class="input-group hide" id="mobile-group">
        <label for="mobile">Enter Mobile Number</label>
        <input type="text" id="mobile" maxlength="10" autocomplete="off" />
      </div>
      <div class="input-group" id="password-group">
        <label for="password">Create Password</label>
        <div class="password-wrapper">
          <input type="password" id="password" required autocomplete="off" />
          <button type="button" class="toggle-password" tabindex="-1" title="Show/Hide password">👁</button>
        </div>
        <div class="strength-meter" id="strength-meter"><div class="strength-bar" id="strength-bar" style="width:0%"></div></div>
        <div class="strength-text" id="strength-text"></div>
      </div>
      <button type="submit" class="signup-btn">Sign Up</button>
    </form>
  </div>
  <!-- Popup -->
  <div class="popup" id="popup">
    <div class="popup-content">
      <span id="popup-message"></span>
      <br>
      <button id="popup-ok-btn">OK</button>
    </div>
  </div>
  <!-- === ANIMATED GRID & ROPES JS, FULLY RESTORED === -->
  <script>
    // Animated Grid Background
    const canvas = document.getElementById("grid-bg");
    const ctx = canvas.getContext("2d");
    let width = window.innerWidth, height = window.innerHeight;
    function resizeCanvas() {
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width;
      canvas.height = height;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);
    let offsetY = 0;
    const gridSize = 18;
    function drawGrid() {
      ctx.clearRect(0, 0, width, height);
      ctx.strokeStyle = 'rgba(255,255,255,0.03)';
      ctx.lineWidth = 0.8;
      for (let x = 0; x < width; x += gridSize) {
        ctx.beginPath();
        ctx.moveTo(x + 0.5, 0);
        ctx.lineTo(x + 0.5, height);
        ctx.stroke();
      }
      for (let y = (offsetY % gridSize); y < height; y += gridSize) {
        ctx.beginPath();
        ctx.moveTo(0, y + 0.5);
        ctx.lineTo(width, y + 0.5);
        ctx.stroke();
      }
      offsetY -= 0.21;
      if (offsetY <= -gridSize) offsetY = 0;
      requestAnimationFrame(drawGrid);
    }
    drawGrid();
    // Animated ropes & grommets
    function drawRopes() {
      const ropeCanvas = document.getElementById("rope-canvas");
      const ropeCtx = ropeCanvas.getContext("2d");
      ropeCanvas.width = window.innerWidth;
      ropeCanvas.height = window.innerHeight;
      const branchSVG = document.getElementById("branch-svg");
      const box = document.getElementById("signup-container");
      // Branch anchor: 80px from left and right of branch bbox, at branch bottom
      const branchRect = branchSVG.getBoundingClientRect();
      const boxRect = box.getBoundingClientRect();
      const bY = branchRect.top + branchRect.height - 6;
      // Box grommet location: a bit inward/outward from box edge, at box top
      const left_branchX = branchRect.left + 80;
      const right_branchX = branchRect.right - 80;
      const left_boxX = boxRect.left + 26;
      const right_boxX = boxRect.right - 26;
      const boxY = boxRect.top + 8;
      function wavyRope(x0, y0, x1, y1, segments = 14, amp = 10) {
        ropeCtx.save();
        ropeCtx.strokeStyle = "#89fd90";
        ropeCtx.lineWidth = 4.2;
        ropeCtx.shadowColor = "#59dd75";
        ropeCtx.shadowBlur = 10;
        ropeCtx.beginPath();
        ropeCtx.moveTo(x0, y0);
        for (let i = 1; i <= segments; i++) {
          let t = i / segments;
          let xt = x0 + (x1 - x0) * t;
          let yt = y0 + (y1 - y0) * t + Math.sin((t + Date.now()/850)*Math.PI * 2) * amp * Math.sin(Math.PI * t);
          ropeCtx.lineTo(xt, yt);
        }
        ropeCtx.stroke();
        ropeCtx.restore();
      }
      ropeCtx.clearRect(0,0,ropeCanvas.width, ropeCanvas.height);
      // Draw left and right ropes
      wavyRope(left_branchX, bY, left_boxX, boxY);
      wavyRope(right_branchX, bY, right_boxX, boxY);
      // Draw grommets: outer dark, then lighter center
      function drawGrommet(cx, cy) {
        ropeCtx.save();
        ropeCtx.beginPath();
        ropeCtx.arc(cx, cy, 13, 0, 2 * Math.PI);
        ropeCtx.fillStyle = "#2d2d2d";
        ropeCtx.globalAlpha = 0.88;
        ropeCtx.fill();
        ropeCtx.globalAlpha = 1;
        ropeCtx.beginPath();
        ropeCtx.arc(cx, cy, 7.2, 0, 2 * Math.PI);
        ropeCtx.strokeStyle = "#88e3b0";
        ropeCtx.lineWidth = 3.2;
        ropeCtx.stroke();
        ropeCtx.restore();
      }
      drawGrommet(left_boxX, boxY);
      drawGrommet(right_boxX, boxY);
      // Draw branch knots
      function drawBranchKnot(cx, cy) {
        ropeCtx.save();
        ropeCtx.beginPath();
        ropeCtx.arc(cx, cy, 7, 0, 2 * Math.PI);
        ropeCtx.fillStyle = "#a6e773";
        ropeCtx.globalAlpha = 0.62;
        ropeCtx.fill();
        ropeCtx.restore();
      }
      drawBranchKnot(left_branchX, bY);
      drawBranchKnot(right_branchX, bY);
    }
    function animateRopeRings() {
      drawRopes();
      requestAnimationFrame(animateRopeRings);
    }
    animateRopeRings();
    window.addEventListener("resize", drawRopes);
  </script>
  <script>
    // Option switch (with fade effect), password toggle, all UI logic
    const emailOpt = document.getElementById('email-opt');
    const mobileOpt = document.getElementById('mobile-opt');
    const emailGroup = document.getElementById('email-group');
    const mobileGroup = document.getElementById('mobile-group');
    const signupForm = document.getElementById('signup-form');
    let signupMode = 'email';
    const pwdInput = document.getElementById('password');
    const pwdToggle = document.querySelector('.toggle-password');
    pwdToggle.addEventListener('click', function() {
      if (pwdInput.type === "password") {
        pwdInput.type = "text";
        this.textContent = "🙈";
      } else {
        pwdInput.type = "password";
        this.textContent = "👁";
      }
    });
    signupForm.addEventListener('reset', () => {
      pwdInput.type = "password";
      pwdToggle.textContent = "👁";
    });
    emailOpt.onclick = () => {
      signupMode = 'email';
      emailOpt.classList.add('active');
      mobileOpt.classList.remove('active');
      emailGroup.classList.remove("hide");
      mobileGroup.classList.add("hide");
      document.getElementById('email').required = true;
      document.getElementById('mobile').required = false;
      pwdInput.type = "password";
      pwdToggle.textContent = "👁";
    };
    mobileOpt.onclick = () => {
      signupMode = 'mobile';
      mobileOpt.classList.add('active');
      emailOpt.classList.remove('active');
      emailGroup.classList.add("hide");
      mobileGroup.classList.remove("hide");
      document.getElementById('email').required = false;
      document.getElementById('mobile').required = true;
      pwdInput.type = "password";
      pwdToggle.textContent = "👁";
    };
    const password = document.getElementById('password');
    const strengthBar = document.getElementById('strength-bar');
    const strengthText = document.getElementById('strength-text');
    password.addEventListener('input', function() {
      const val = password.value;
      const score = getPasswordScore(val);
      let perc = [0,25,50,75,100][score];
      strengthBar.style.width = perc + "%";
      let txt = ["", "Weak","Fair","Medium","Strong"];
      strengthText.textContent = txt[score] || '';
      strengthBar.style.background = [
        "#232323",
        "linear-gradient(90deg,#ff4d79,#efab35)",
        "linear-gradient(90deg,#efab35,#becb28 95%)",
        "linear-gradient(90deg,#becb28,#43e85c 100%)",
        "linear-gradient(90deg,#43e85c,#30d3ea 100%)"
      ][score];
      if(val.length===0) {
        password.classList.remove("valid","invalid");
      } else if(score > 2&&val.length>=6) {
        password.classList.add("valid"); password.classList.remove("invalid");
      } else {
        password.classList.add("invalid"); password.classList.remove("valid");
      }
    });
    function getPasswordScore(val) {
      let score = 0;
      if (!val) return 0;
      if (val.length>=6) score++;
      if (/[A-Z]/.test(val)) score++;
      if (/[0-9]/.test(val)) score++;
      if (/[^A-Za-z0-9]/.test(val)) score++;
      return Math.min(score, 4);
    }
    function validateEmail(email) {
      return /^[\w\-\.]+@([\w-]+\.)+[\w-]{2,4}$/.test(email);
    }
    function validateMobile(mob) {
      return /^[6-9]\d{9}$/.test(mob);
    }
    document.getElementById('name').addEventListener('input', function(){
      if(this.value.trim().length>1) {
        this.classList.add('valid'); this.classList.remove('invalid');
      } else {
        this.classList.remove('valid'); this.classList.remove('invalid');
      }
    });
    document.getElementById('email').addEventListener('input', function(){
      if(validateEmail(this.value)) {
        this.classList.add('valid'); this.classList.remove('invalid');
      } else {
        this.classList.remove('valid'); this.classList.remove('invalid');
      }
    });
    document.getElementById('mobile').addEventListener('input', function(){
      if(validateMobile(this.value)) {
        this.classList.add('valid'); this.classList.remove('invalid');
      } else {
        this.classList.remove('valid'); this.classList.remove('invalid');
      }
    });
  signupForm.addEventListener('submit', function(e) {
  e.preventDefault();
  const name = document.getElementById('name').value.trim();
  const email = document.getElementById('email').value.trim();
  const mobile = document.getElementById('mobile').value.trim();
  const passwordVal = document.getElementById('password').value;

  // Validation
  if (!name) {
    showPopup("Please enter your name.");
    document.getElementById('name').classList.add('invalid');
    return;
  }
  if (signupMode === 'email') {
    if (!validateEmail(email)) {
      showPopup("Please enter a valid email.");
      document.getElementById('email').classList.add('invalid');
      return;
    }
    if (!passwordVal || passwordVal.length < 6) {
      showPopup("Password should be at least 6 characters.");
      document.getElementById('password').classList.add('invalid');
      return;
    }
  } else {
    if (!validateMobile(mobile)) {
      showPopup("Enter a valid 10-digit mobile number starting with 6-9.");
      document.getElementById('mobile').classList.add('invalid');
      return;
    }
    if (!passwordVal || passwordVal.length < 6) {
      showPopup("Password should be at least 6 characters.");
      document.getElementById('password').classList.add('invalid');
      return;
    }
  }

  // Construct and save the unified profile
  const ecoUser = {
    name: name,
    avatar: "https://api.dicebear.com/7.x/thumbs/svg?seed=" + encodeURIComponent(name),
    level: "Green Beginner",
    points: 0,
    contact: signupMode === 'email' ? email : mobile,
    mode: signupMode
  };
localStorage.setItem("ecoUser", JSON.stringify(ecoUser));


  // Redirect after success
  showPopup("Signup Successful!", true);
  signupForm.reset();
  document.querySelectorAll('.valid').forEach(e=>e.classList.remove('valid'));
  document.getElementById('strength-bar').style.width = "0%";
  document.getElementById('strength-text').textContent = "";
});


function showPopup(message, redirect = false) {
  const popup = document.getElementById('popup');
  const popupMessage = document.getElementById('popup-message');
  popupMessage.textContent = message;
  popup.classList.add('show');
  document.getElementById('popup-ok-btn').onclick = () => {
    popup.classList.remove('show');
    if (redirect) {
      window.location.href = "dashboard.html";
    }
  };
}

    
    // Add near the end of your JavaScript
const trailRoot = document.getElementById('cursor-trail-root');
document.addEventListener('mousemove', function(e) {
  const dot = document.createElement('div');
  dot.className = 'cursor-dot';
  dot.style.left = `${e.clientX}px`;
  dot.style.top = `${e.clientY}px`;
  trailRoot.appendChild(dot);
  setTimeout(() => dot.remove(), 650);
});


  </script>
</body>
