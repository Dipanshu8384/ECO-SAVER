<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>EcoSaver - Join Our Community</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    :root {
      --background-dark: hsl(222, 47%, 11%);
      --text-light: hsl(210, 40%, 98%);
      --text-muted: hsl(215, 20%, 65%);
      --primary-green: hsl(142, 71%, 41%);
      --primary-green-light: hsl(142, 80%, 98%);
      --primary-green-darker: hsl(142, 76%, 36%);
      --accent-yellow: hsl(45, 93%, 62%);
    }

    html, body {
      height: 100%; margin: 0; padding: 0; overflow: hidden;
    }
    
    body {
      background-color: var(--background-dark);
      width: 100vw; height: 100vh;
      font-family: 'Segoe UI', Arial, sans-serif;
      display: flex; align-items: center; justify-content: center;
      position: relative;
      overflow: hidden;
    }

    /* Multiple layered background images for depth - exact copy from landing.html */
    .hero-bg-image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.3;
    }
    
    .hero-bg-layer-1 {
      animation: windSwayIntense 6s ease-in-out infinite;
      transform-origin: bottom center;
      z-index: 1;
    }
    
    .hero-bg-layer-2 {
      animation: windSwayGentle 8s ease-in-out infinite reverse;
      transform-origin: bottom left;
      opacity: 0.15;
      z-index: 2;
    }
    
    .hero-bg-layer-3 {
      animation: windSwayMedium 7s ease-in-out infinite alternate;
      transform-origin: bottom right;
      opacity: 0.2;
      z-index: 3;
    }
    
    /* Gentle wind animations - exact copy from landing.html */
    @keyframes windSwayIntense {
      0% { 
        transform: translateX(0) rotate(0deg) scale(1); 
      }
      25% { 
        transform: translateX(-2px) rotate(-0.3deg) scale(1.002); 
      }
      50% { 
        transform: translateX(3px) rotate(0.4deg) scale(1.003); 
      }
      75% { 
        transform: translateX(-1px) rotate(-0.2deg) scale(1.001); 
      }
      100% { 
        transform: translateX(1px) rotate(0.1deg) scale(1.001); 
      }
    }
    
    @keyframes windSwayGentle {
      0%, 100% { 
        transform: translateX(0) translateY(0) rotate(0deg) scale(1);
      }
      50% { 
        transform: translateX(2px) translateY(-1px) rotate(0.2deg) scale(1.001);
      }
    }
    
    @keyframes windSwayMedium {
      0% { 
        transform: translateX(0) rotate(0deg) scale(1);
      }
      33% { 
        transform: translateX(-1.5px) rotate(-0.25deg) scale(1.001);
      }
      66% { 
        transform: translateX(2.5px) rotate(0.35deg) scale(1.002);
      }
      100% { 
        transform: translateX(-0.5px) rotate(-0.1deg) scale(1.0005);
      }
    }

    /* Hero-style overlay - keeping signup's unique gradient */
    .hero-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, hsl(195, 45%, 25%), hsl(270, 35%, 15%));
      opacity: 0.8;
      z-index: 4;
    }

    /* Advanced wind particles system - exact copy from landing.html */
    .wind-particles {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 5;
    }
    
    .wind-particle {
      position: absolute;
      border-radius: 50%;
      animation: advancedFloat var(--duration) var(--timing) infinite;
    }
    
    /* Different particle types */
    .wind-particle.leaf {
      width: 8px;
      height: 6px;
      background: linear-gradient(45deg, #4ade80, #22c55e);
      border-radius: 0 100% 0 100%;
      transform-origin: center;
    }
    
    .wind-particle.dust {
      width: 3px;
      height: 3px;
      background: rgba(255, 255, 255, 0.4);
      border-radius: 50%;
    }
    
    .wind-particle.pollen {
      width: 5px;
      height: 5px;
      background: radial-gradient(circle, #fbbf24, #f59e0b);
      border-radius: 50%;
    }
    
    /* Particle positioning and timing - gentler */
    .wind-particle:nth-child(1) { 
      top: 15%; left: -20px; --duration: 12s; --timing: ease-out;
      animation-delay: 0s;
    }
    .wind-particle:nth-child(2) { 
      top: 25%; left: -20px; --duration: 15s; --timing: ease-in-out;
      animation-delay: 3s;
    }
    .wind-particle:nth-child(3) { 
      top: 45%; left: -20px; --duration: 14s; --timing: ease-out;
      animation-delay: 6s;
    }
    .wind-particle:nth-child(4) { 
      top: 65%; left: -20px; --duration: 18s; --timing: ease-in-out;
      animation-delay: 9s;
    }
    .wind-particle:nth-child(5) { 
      top: 85%; left: -20px; --duration: 16s; --timing: ease-out;
      animation-delay: 4s;
    }
    .wind-particle:nth-child(6) { 
      top: 35%; left: -20px; --duration: 20s; --timing: ease-in-out;
      animation-delay: 12s;
    }
    .wind-particle:nth-child(7) { 
      top: 55%; left: -20px; --duration: 17s; --timing: ease-out;
      animation-delay: 15s;
    }
    .wind-particle:nth-child(8) { 
      top: 75%; left: -20px; --duration: 22s; --timing: ease-in-out;
      animation-delay: 2s;
    }
    
    @keyframes advancedFloat {
      0% {
        transform: translateX(0) translateY(0) rotate(0deg) scale(0);
        opacity: 0;
      }
      10% {
        transform: translateX(30px) translateY(-5px) rotate(90deg) scale(1);
        opacity: 0.6;
      }
      30% {
        transform: translateX(120px) translateY(-10px) rotate(180deg) scale(1.1);
        opacity: 0.8;
      }
      50% {
        transform: translateX(250px) translateY(5px) rotate(270deg) scale(0.9);
        opacity: 1;
      }
      70% {
        transform: translateX(380px) translateY(-8px) rotate(360deg) scale(1.05);
        opacity: 0.8;
      }
      90% {
        transform: translateX(500px) translateY(3px) rotate(450deg) scale(0.8);
        opacity: 0.4;
      }
      100% {
        transform: translateX(calc(100vw + 30px)) translateY(-10px) rotate(540deg) scale(0);
        opacity: 0;
      }
    }
    
    #grid-bg { 
      position: absolute; 
      top: 0; 
      left: 0; 
      width: 100vw; 
      height: 100vh; 
      z-index: 0; 
      pointer-events: none;
    }
    #branch-svg {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 370px;
      height: 65px;
      z-index: 10;
      pointer-events: none;
    }
    #rope-canvas {
      position: absolute;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      z-index: 18;
      pointer-events: none;
    }
    .signup-container {
      position: absolute;
      left: 50%; top: 46%;
      transform: translate(-50%, -50%);
      width: 400px;
      padding: 40px 30px;
      border-radius: 25px;
      background: rgba(0, 0, 0, 0.25);
      backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 
        0 8px 32px 0 rgba(0, 0, 0, 0.3),
        inset 0 1px 0 rgba(255, 255, 255, 0.1);
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 10;
    }
    
    form {
      width: 100%;
      background: transparent;
      border-radius: 20px;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    
    form h2 {
      color: rgba(255, 255, 255, 0.9);
      font-size: 28px;
      margin-bottom: 25px;
      text-align: center;
      font-weight: 300;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
    }
    
    .signup-options {
      display: flex; 
      justify-content: center; 
      margin-bottom: 22px; 
      gap: 12px;
      width: 100%;
    }
    .option-btn {
      background: #181818; color: #dadada;
      border: 1.5px solid #222; border-radius: 8px 8px 0 0;
      padding: 8px 18px; font-size: 15px;
      cursor: pointer; outline: none;
      transition: background .2s, color .2s, box-shadow .3s;
      box-shadow: none;
    }
    .option-btn.active {
      background: #4ade80;
      color: #111;
      border-bottom: 2.5px solid #4ade80;
      font-weight: bold;
      box-shadow: 0 2px 12px #22d3ee44;
    }
    .input-group {
      margin-bottom: 22px; display: flex; flex-direction: column;
      opacity: 1; transition: opacity 0.32s;
    }
    .input-group.hide {
      opacity: 0;
      pointer-events: none;
      height: 0;
      margin: 0;
      overflow: hidden;
    }
    .input-group label { 
      color: rgba(255, 255, 255, 0.8); 
      font-size: 14px; 
      margin-bottom: 6px; 
      font-weight: 400;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.5);
    }
    .input-group input {
      padding: 12px 16px; 
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.15); 
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      color: rgba(255, 255, 255, 0.9);
      font-size: 16px; 
      outline: none; 
      width: 100%;
    }
    .input-group input:focus {
      border: 1px solid rgba(76, 222, 128, 0.5);
      background: rgba(255, 255, 255, 0.15);
      box-shadow: 0 4px 20px rgba(76, 222, 128, 0.2);
    }
    .input-group input.valid {
      border: 1px solid rgba(76, 222, 128, 0.6) !important;
      background: rgba(76, 222, 128, 0.1);
      box-shadow: 0 0 15px rgba(76, 222, 128, 0.3);
    }
    .input-group input.invalid {
      border: 1px solid rgba(255, 68, 84, 0.6) !important;
      background: rgba(255, 68, 84, 0.1);
    }
    }
    
    .password-wrapper {
      position: relative; display: flex; align-items: center;
    }
    .toggle-password {
      position: absolute; right: 11px; top: 9px;
      cursor: pointer;
      background: none;
      color: #70f5d3;
      font-size: 1.05em;
      border: none;
      z-index: 2;
      transition: color 0.20s;
    }
    .toggle-password:hover { color: #d4ba4d; }
    .strength-meter {
      width: 100%; height: 6px; border-radius: 4px;
      margin-top: 5px;
      background: #232323;
      overflow: hidden;
      box-shadow: 0 0 5px #129fa2;
    }
    .strength-bar {
      height: 100%; transition: width 0.35s;
      background: linear-gradient(90deg,#ff4d79,#efab35,#becb28,#43e85c,#30d3ea);
    }
    .strength-text {
      font-size: 13px; margin-top: 2px; color: #8de4c7; font-weight: 500;
    }
    .signup-btn {
      width: 100%; 
      padding: 15px 0; 
      border: 1px solid rgba(76, 222, 128, 0.3); 
      border-radius: 12px;
      font-weight: 600; 
      font-size: 16px;
      background: rgba(76, 222, 128, 0.15);
      backdrop-filter: blur(10px);
      color: rgba(255, 255, 255, 0.9); 
      cursor: pointer; 
      box-shadow: 0 4px 20px rgba(76, 222, 128, 0.2);
      position: relative;
      overflow: hidden;
      margin-top: 10px;
    }
    .signup-btn::after {
      content: '';
      position: absolute; 
      top: 0; 
      left: -100%; 
      height: 100%; 
      width: 100%;
      background: rgba(76, 222, 128, 0.1);
    }
    .signup-btn:hover { 
      background: rgba(76, 222, 128, 0.25);
      box-shadow: 0 6px 30px rgba(76, 222, 128, 0.4);
      border-color: rgba(76, 222, 128, 0.5);
    }
    .signup-btn:hover::after {
      left: 0;
    }
    .popup { display: none; position: fixed; z-index: 30; left: 0; top: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.33); align-items: center; justify-content: center; animation: fade-in 0.33s; }
    .popup.show {
      display: flex; animation: fade-in 0.2s;
    }
    @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
    .popup-content {
      background: #181818; color: #fff;
      border-radius: 14px; padding: 32px 20px 18px 20px;
      text-align: center; min-width: 240px;
      box-shadow: 0 8px 32px 0 rgba(31,38,135,.37);
    }
    
    /* OTP Verification Popup */
    .otp-popup {
      display: none;
      position: fixed;
      z-index: 40;
      left: 0;
      top: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.7);
      align-items: center;
      justify-content: center;
    }
    .otp-popup.show {
      display: flex;
      animation: fade-in 0.3s;
    }
    .otp-content {
      background: rgba(24, 24, 24, 0.95);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 40px 30px;
      text-align: center;
      min-width: 380px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      color: #fff;
    }
    .otp-title {
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 10px;
      color: rgba(255, 255, 255, 0.9);
    }
    .otp-subtitle {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.6);
      margin-bottom: 30px;
    }
    .otp-input-container {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin-bottom: 30px;
    }
    .otp-digit {
      width: 50px;
      height: 50px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border-radius: 8px;
      text-align: center;
      font-size: 20px;
      font-weight: 600;
      color: #fff;
      outline: none;
    }
    .otp-digit:focus {
      border-color: rgba(76, 222, 128, 0.5);
      background: rgba(255, 255, 255, 0.15);
      box-shadow: 0 0 15px rgba(76, 222, 128, 0.3);
    }
    .otp-buttons {
      display: flex;
      gap: 15px;
      justify-content: center;
    }
    .otp-btn {
      padding: 12px 24px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border-radius: 8px;
      color: #fff;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
    }
    .otp-btn.primary {
      background: rgba(76, 222, 128, 0.2);
      border-color: rgba(76, 222, 128, 0.3);
    }
    .otp-btn:hover {
      background: rgba(255, 255, 255, 0.2);
    }
    .otp-btn.primary:hover {
      background: rgba(76, 222, 128, 0.3);
    }
    .otp-timer {
      margin-top: 20px;
      font-size: 14px;
      color: rgba(255, 255, 255, 0.6);
    }
    .resend-otp {
      color: rgba(76, 222, 128, 0.8);
      cursor: pointer;
      text-decoration: underline;
    }
    .resend-otp:hover {
      color: rgba(76, 222, 128, 1);
    }
    #popup-ok-btn {
      margin-top: 16px; padding: 8px 22px; border-radius: 7px; border: none;
      background: #4ade80; color: #000;
      font-weight: bold; font-size: 15px;
      cursor: pointer; transition: background .2s;
    }
    #popup-ok-btn:hover { background: #22d3ee; }
    @media (max-width: 450px) {
      .signup-container, form { width: 98vw !important; padding: 14vw 2vw !important;}
    }

  </style>
  <!-- EcoSaver Production Backend Integration - Load First -->
  <script src="ecosaver-frontend-production.js"></script>
</head>

  <!-- === ANIMATED GRID & ROPES JS, FULLY RESTORED === -->
  <script>
    // OTP Verification System
    let currentOtp = '';
    let otpTimer = null;
    let otpCountdown = 60;
    let verificationTarget = ''; // email or mobile
    let targetValue = '';

    // Email validation
    function isValidEmail(email) {
      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      return emailRegex.test(email);
    }

    // Mobile validation  
    function isValidMobile(mobile) {
      const mobileRegex = /^[6-9]\d{9}$/;
      return mobileRegex.test(mobile);
    }

    // Generate random 6-digit OTP
    function generateOtp() {
      return Math.floor(100000 + Math.random() * 900000).toString();
    }

    // Show OTP popup
    async function showOtpPopup(type, value) {
      verificationTarget = type;
      targetValue = value;
      
      try {
        // Use production backend to generate and send OTP
        const response = await window.EcoAPI.auth.generateOtp({
          type: type,
          value: value
        });
        
        if (response.success) {
          currentOtp = response.otp; // In production, this won't be returned for security
          
          const otpPopup = document.getElementById('otp-popup');
          const subtitle = document.getElementById('otp-subtitle');
          const title = document.querySelector('.otp-title');
          
          if (type === 'email') {
            title.textContent = 'Email Verification';
            subtitle.innerHTML = `Enter the 6-digit code sent to ${value}`;
          } else {
            title.textContent = 'Mobile Verification';
            subtitle.innerHTML = `Enter the 6-digit code sent to +91-${value}`;
          }
          
          // Clear OTP inputs
          for (let i = 1; i <= 6; i++) {
            document.getElementById(`otp${i}`).value = '';
          }
          
          otpPopup.classList.add('show');
          document.getElementById('otp1').focus();
          
          startOtpTimer();

    // Animated Grid Background
    const canvas = document.getElementById("grid-bg");
    const ctx = canvas.getContext("2d");
    let width = window.innerWidth, height = window.innerHeight;
    function resizeCanvas() {
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width;
      canvas.height = height;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);
    let offsetY = 0;
    const gridSize = 18;
    function drawGrid() {
      ctx.clearRect(0, 0, width, height);
      ctx.strokeStyle = 'rgba(255,255,255,0.03)';
      ctx.lineWidth = 0.8;
      for (let x = 0; x < width; x += gridSize) {
        ctx.beginPath();
        ctx.moveTo(x + 0.5, 0);
        ctx.lineTo(x + 0.5, height);
        ctx.stroke();
      }
      for (let y = (offsetY % gridSize); y < height; y += gridSize) {
        ctx.beginPath();
        ctx.moveTo(0, y + 0.5);
        ctx.lineTo(width, y + 0.5);
        ctx.stroke();
      }
      offsetY -= 0.21;
      if (offsetY <= -gridSize) offsetY = 0;
      requestAnimationFrame(drawGrid);
    }
    drawGrid();
    // Animated ropes & grommets
    function drawRopes() {
      const ropeCanvas = document.getElementById("rope-canvas");
      const ropeCtx = ropeCanvas.getContext("2d");
      ropeCanvas.width = window.innerWidth;
      ropeCanvas.height = window.innerHeight;
      const branchSVG = document.getElementById("branch-svg");
      const box = document.getElementById("signup-container");
      // Branch anchor: 80px from left and right of branch bbox, at branch bottom
      const branchRect = branchSVG.getBoundingClientRect();
      const boxRect = box.getBoundingClientRect();
      const bY = branchRect.top + branchRect.height - 6;
      // Box grommet location: a bit inward/outward from box edge, at box top
      const left_branchX = branchRect.left + 80;
      const right_branchX = branchRect.right - 80;
      const left_boxX = boxRect.left + 26;
      const right_boxX = boxRect.right - 26;
      const boxY = boxRect.top + 8;
      function wavyRope(x0, y0, x1, y1, segments = 14, amp = 10) {
        ropeCtx.save();
        ropeCtx.strokeStyle = "#89fd90";
        ropeCtx.lineWidth = 4.2;
        ropeCtx.shadowColor = "#59dd75";
        ropeCtx.shadowBlur = 10;
        ropeCtx.beginPath();
        ropeCtx.moveTo(x0, y0);
        for (let i = 1; i <= segments; i++) {
          let t = i / segments;
          let xt = x0 + (x1 - x0) * t;
          let yt = y0 + (y1 - y0) * t + Math.sin((t + Date.now()/850)*Math.PI * 2) * amp * Math.sin(Math.PI * t);
          ropeCtx.lineTo(xt, yt);
        }
        ropeCtx.stroke();
        ropeCtx.restore();
      }
      ropeCtx.clearRect(0,0,ropeCanvas.width, ropeCanvas.height);
      // Draw left and right ropes
      wavyRope(left_branchX, bY, left_boxX, boxY);
      wavyRope(right_branchX, bY, right_boxX, boxY);
      // Draw grommets: outer dark, then lighter center
      function drawGrommet(cx, cy) {
        ropeCtx.save();
        ropeCtx.beginPath();
        ropeCtx.arc(cx, cy, 13, 0, 2 * Math.PI);
        ropeCtx.fillStyle = "#2d2d2d";
        ropeCtx.globalAlpha = 0.88;
        ropeCtx.fill();
        ropeCtx.globalAlpha = 1;
        ropeCtx.beginPath();
        ropeCtx.arc(cx, cy, 7.2, 0, 2 * Math.PI);
        ropeCtx.strokeStyle = "#88e3b0";
        ropeCtx.lineWidth = 3.2;
        ropeCtx.stroke();
        ropeCtx.restore();
      }
      drawGrommet(left_boxX, boxY);
      drawGrommet(right_boxX, boxY);
      // Draw branch knots
      function drawBranchKnot(cx, cy) {
        ropeCtx.save();
        ropeCtx.beginPath();
        ropeCtx.arc(cx, cy, 7, 0, 2 * Math.PI);
        ropeCtx.fillStyle = "#a6e773";
        ropeCtx.globalAlpha = 0.62;
        ropeCtx.fill();
        ropeCtx.restore();
      }
      drawBranchKnot(left_branchX, bY);
      drawBranchKnot(right_branchX, bY);
    }
    function animateRopeRings() {
      drawRopes();
      requestAnimationFrame(animateRopeRings);
    }
    animateRopeRings();
    window.addEventListener("resize", drawRopes);
  </script>

  const popup = document.getElementById('popup');
  const popupMessage = document.getElementById('popup-message');
  popupMessage.textContent = message;
  popup.classList.add('show');
  
  document.getElementById('popup-ok-btn').onclick = () => {
    popup.classList.remove('show');
    if (redirect) {
      window.location.href = "dashboard.html";
    }
  };

  if (redirect) {
    setTimeout(() => {
      popup.classList.remove('show');
      window.location.href = "dashboard.html";
    }, 2000);
