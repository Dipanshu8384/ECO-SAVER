<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="A beautiful quote of the day application."
  >

  <title>Quote of the Day</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #f0fdf4;
      --card: rgba(255, 255, 255, 0.85);
      --text: #1f2937;
      --muted: #6b7280;
      --primary: #16a34a;
      --primary-dark: #15803d;
      --border: #bbf7d0;
      --soft: #dcfce7;
      --shadow: rgba(0, 0, 0, 0.12);
    }

    body.dark {
      --bg: #0f172a;
      --card: rgba(30, 41, 59, 0.9);
      --text: #f8fafc;
      --muted: #cbd5e1;
      --primary: #4ade80;
      --primary-dark: #22c55e;
      --border: #166534;
      --soft: #14532d;
      --shadow: rgba(0, 0, 0, 0.4);
    }

    body {
      min-height: 100vh;
      font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      background:
        radial-gradient(
          circle at top left,
          rgba(134, 239, 172, 0.35),
          transparent 35%
        ),
        radial-gradient(
          circle at bottom right,
          rgba(147, 197, 253, 0.3),
          transparent 35%
        ),
        var(--bg);

      color: var(--text);

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 20px;

      transition:
        background 0.3s ease,
        color 0.3s ease;
    }

    /* Main card */

    .card {
      width: 100%;
      max-width: 520px;

      background: var(--card);

      border: 1px solid var(--border);
      border-radius: 24px;

      padding: 28px;

      box-shadow:
        0 20px 50px var(--shadow);

      backdrop-filter: blur(15px);

      animation: cardAppear 0.5s ease;
    }

    @keyframes cardAppear {
      from {
        opacity: 0;
        transform: translateY(15px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Header */

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;

      margin-bottom: 24px;
    }

    .title-section {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .title-icon {
      width: 42px;
      height: 42px;

      display: flex;
      align-items: center;
      justify-content: center;

      background: var(--soft);
      border-radius: 12px;

      font-size: 21px;
    }

    .card-title {
      font-size: 20px;
      font-weight: 700;
    }

    .subtitle {
      font-size: 12px;
      color: var(--muted);
      margin-top: 3px;
    }

    /* Header buttons */

    .header-actions {
      display: flex;
      gap: 6px;
    }

    .icon-btn {
      width: 38px;
      height: 38px;

      display: flex;
      align-items: center;
      justify-content: center;

      border: none;
      border-radius: 50%;

      background: transparent;

      color: var(--primary-dark);

      cursor: pointer;

      transition:
        background 0.2s,
        transform 0.2s;
    }

    .icon-btn:hover {
      background: var(--soft);
      transform: translateY(-2px);
    }

    .icon-btn:active {
      transform: scale(0.9);
    }

    .icon-btn svg {
      width: 19px;
      height: 19px;
    }

    /* Category */

    .category {
      display: inline-flex;

      padding: 6px 12px;

      border-radius: 20px;

      background: var(--soft);
      color: var(--primary-dark);

      font-size: 12px;
      font-weight: 600;

      margin-bottom: 18px;
    }

    /* Quote */

    .quote-wrapper {
      min-height: 190px;

      display: flex;
      flex-direction: column;
      justify-content: center;

      transition:
        opacity 0.3s,
        transform 0.3s;
    }

    .quote-wrapper.fade {
      opacity: 0;
      transform: translateY(8px);
    }

    .quote {
      position: relative;

      border-left: 4px solid var(--primary);

      padding-left: 18px;

      font-size: 22px;
      line-height: 1.6;

      font-style: italic;

      color: var(--text);
    }

    .quote::before {
      content: "“";

      position: absolute;

      left: -5px;
      top: -30px;

      font-size: 70px;

      color: var(--primary);

      opacity: 0.2;
    }

    .author {
      text-align: right;

      margin-top: 18px;

      font-size: 14px;
      font-weight: 600;

      color: var(--primary-dark);
    }

    /* Bottom actions */

    .actions {
      display: flex;

      justify-content: space-between;
      align-items: center;

      margin-top: 24px;

      padding-top: 18px;

      border-top: 1px solid var(--border);
    }

    .action-group {
      display: flex;
      gap: 8px;
    }

    .action-btn {
      display: flex;
      align-items: center;
      gap: 7px;

      border: 1px solid var(--border);

      background: transparent;

      color: var(--text);

      padding: 9px 13px;

      border-radius: 10px;

      cursor: pointer;

      font-size: 13px;

      transition: 0.2s;
    }

    .action-btn:hover {
      background: var(--soft);
      transform: translateY(-2px);
    }

    .favorite.active {
      color: #ef4444;
    }

    /* Refresh button */

    .refresh-main {
      display: flex;
      align-items: center;
      gap: 8px;

      border: none;

      background: var(--primary);

      color: white;

      padding: 10px 16px;

      border-radius: 10px;

      font-weight: 600;

      cursor: pointer;

      transition: 0.2s;
    }

    .refresh-main:hover {
      background: var(--primary-dark);
      transform: translateY(-2px);
    }

    .refresh-main:active {
      transform: scale(0.96);
    }

    /* Counter */

    .counter {
      text-align: center;

      margin-top: 18px;

      font-size: 11px;

      color: var(--muted);
    }

    /* Skeleton */

    .skeleton {
      height: 16px;

      border-radius: 5px;

      margin-bottom: 10px;

      background:
        linear-gradient(
          90deg,
          var(--soft) 25%,
          var(--border) 50%,
          var(--soft) 75%
        );

      background-size: 200% 100%;

      animation: shimmer 1.5s infinite;
    }

    @keyframes shimmer {
      100% {
        background-position: -200% 0;
      }
    }

    /* Spin */

    .spin {
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      100% {
        transform: rotate(360deg);
      }
    }

    /* Toast */

    .toast {
      position: fixed;

      bottom: 25px;
      left: 50%;

      transform: translate(-50%, 20px);

      background: #111827;
      color: white;

      padding: 10px 16px;

      border-radius: 10px;

      font-size: 13px;

      opacity: 0;

      pointer-events: none;

      transition: 0.3s;

      z-index: 100;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    /* Mobile */

    @media (max-width: 600px) {

      body {
        padding: 12px;
      }

      .card {
        padding: 20px;

        border-radius: 20px;
      }

      .quote {
        font-size: 19px;
      }

      .actions {
        flex-direction: column;
        gap: 15px;
        align-items: stretch;
      }

      .action-group {
        justify-content: center;
      }

      .refresh-main {
        justify-content: center;
      }
    }
  </style>
</head>

<body>

  <main class="card">

    <!-- Header -->

    <header class="card-header">

      <div class="title-section">

        <div class="title-icon">
          🌱
        </div>

        <div>
          <div class="card-title">
            Quote of the Day
          </div>

          <div class="subtitle">
            A little inspiration for today
          </div>
        </div>

      </div>

      <div class="header-actions">

        <button
          class="icon-btn"
          id="themeBtn"
          aria-label="Toggle dark mode"
        >
          <svg
            id="themeIcon"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            viewBox="0 0 24 24"
          >
            <circle cx="12" cy="12" r="4"></circle>
            <path
              d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"
            />
          </svg>
        </button>

      </div>

    </header>


    <!-- Category -->

    <div class="category" id="category">
      🌍 Nature
    </div>


    <!-- Quote -->

    <section
      class="quote-wrapper"
      id="quoteContent"
      aria-live="polite"
    >

      <div class="skeleton" style="width:100%;"></div>

      <div class="skeleton" style="width:85%;"></div>

      <div class="skeleton" style="width:55%;"></div>

    </section>


    <!-- Actions -->

    <div class="actions">

      <div class="action-group">

        <button
          class="action-btn favorite"
          id="favoriteBtn"
          aria-label="Favorite quote"
        >
          ♡
          <span>Favorite</span>
        </button>

        <button
          class="action-btn"
          id="copyBtn"
        >
          📋
          <span>Copy</span>
        </button>

        <button
          class="action-btn"
          id="shareBtn"
        >
          ↗
          <span>Share</span>
        </button>

      </div>


      <button
        class="refresh-main"
        id="refreshBtn"
      >
        <svg
          width="16"
          height="16"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M20 11a8.1 8.1 0 00-15.5-2M4 5v4h4M4 13a8.1 8.1 0 0015.5 2M20 19v-4h-4"
          />
        </svg>

        New Quote
      </button>

    </div>


    <!-- Counter -->

    <div class="counter">
      Quote #<span id="quoteNumber">1</span>
    </div>

  </main>


  <!-- Toast -->

  <div
    class="toast"
    id="toast"
  ></div>


  <script>

    /* --------------------------------
       Quotes
    -------------------------------- */

    const quotes = [

      {
        quote:
          "The Earth does not belong to us: we belong to the Earth.",
        author:
          "Marlee Matlin",
        category:
          "🌍 Nature"
      },

      {
        quote:
          "We do not inherit the Earth from our ancestors; we borrow it from our children.",
        author:
          "Native Proverb",
        category:
          "🌱 Sustainability"
      },

      {
        quote:
          "Sustainability is not a choice, it is a responsibility.",
        author:
          "Unknown",
        category:
          "♻️ Sustainability"
      },

      {
        quote:
          "In every walk with nature, one receives far more than he seeks.",
        author:
          "John Muir",
        category:
          "🏔️ Nature"
      },

      {
        quote:
          "Look deep into nature, and then you will understand everything better.",
        author:
          "Albert Einstein",
        category:
          "🌿 Wisdom"
      },

      {
        quote:
          "The greatest threat to our planet is the belief that someone else will save it.",
        author:
          "Robert Swan",
        category:
          "🌎 Environment"
      }

    ];


    /* --------------------------------
       Elements
    -------------------------------- */

    const refreshBtn =
      document.getElementById("refreshBtn");

    const quoteContent =
      document.getElementById("quoteContent");

    const favoriteBtn =
      document.getElementById("favoriteBtn");

    const copyBtn =
      document.getElementById("copyBtn");

    const shareBtn =
      document.getElementById("shareBtn");

    const themeBtn =
      document.getElementById("themeBtn");

    const category =
      document.getElementById("category");

    const quoteNumber =
      document.getElementById("quoteNumber");

    const toast =
      document.getElementById("toast");


    /* --------------------------------
       State
    -------------------------------- */

    let currentQuote = null;

    let counter = 0;


    /* --------------------------------
       Toast
    -------------------------------- */

    function showToast(message) {

      toast.textContent = message;

      toast.classList.add("show");

      setTimeout(() => {

        toast.classList.remove("show");

      }, 2000);

    }


    /* --------------------------------
       Loading
    -------------------------------- */

    function showLoading() {

      quoteContent.innerHTML = `

        <div class="skeleton"
             style="width:100%;"></div>

        <div class="skeleton"
             style="width:85%;"></div>

        <div class="skeleton"
             style="width:55%;"></div>

      `;
    }


    /* --------------------------------
       Fetch Quote
    -------------------------------- */

    function fetchQuote() {

      showLoading();

      refreshBtn.classList.add("spin");

      setTimeout(() => {

        let randomQuote;

        do {

          randomQuote =
            quotes[
              Math.floor(
                Math.random() * quotes.length
              )
            ];

        } while (
          quotes.length > 1 &&
          randomQuote === currentQuote
        );


        currentQuote = randomQuote;

        counter++;

        renderQuote();

        refreshBtn.classList.remove("spin");

      }, 500);
    }


    /* --------------------------------
       Render
    -------------------------------- */

    function renderQuote() {

      quoteContent.classList.add("fade");

      setTimeout(() => {

        quoteContent.innerHTML = `

          <blockquote class="quote">
            ${currentQuote.quote}
          </blockquote>

          <p class="author">
            — ${currentQuote.author}
          </p>

        `;

        category.textContent =
          currentQuote.category;

        quoteNumber.textContent =
          counter;

        quoteContent.classList.remove("fade");

        updateFavoriteState();

      }, 250);
    }


    /* --------------------------------
       Favorite
    -------------------------------- */

    function getFavorites() {

      return JSON.parse(
        localStorage.getItem("favoriteQuotes") || "[]"
      );

    }


    function isFavorite() {

      return getFavorites().some(
        q =>
          q.quote === currentQuote.quote
      );

    }


    function updateFavoriteState() {

      if (isFavorite()) {

        favoriteBtn.classList.add("active");

        favoriteBtn.innerHTML =
          "♥ <span>Favorited</span>";

      } else {

        favoriteBtn.classList.remove("active");

        favoriteBtn.innerHTML =
          "♡ <span>Favorite</span>";
      }
    }


    favoriteBtn.addEventListener(
      "click",
      () => {

        if (!currentQuote) return;

        let favorites = getFavorites();

        const index =
          favorites.findIndex(
            q =>
              q.quote === currentQuote.quote
          );


        if (index === -1) {

          favorites.push(currentQuote);

          showToast("❤️ Added to favorites");

        } else {

          favorites.splice(index, 1);

          showToast("Removed from favorites");
        }


        localStorage.setItem(
          "favoriteQuotes",
          JSON.stringify(favorites)
        );


        updateFavoriteState();

      }
    );


    /* --------------------------------
       Copy
    -------------------------------- */

    copyBtn.addEventListener(
      "click",
      async () => {

        if (!currentQuote) return;

        const text =
          `"${currentQuote.quote}" — ${currentQuote.author}`;

        try {

          await navigator.clipboard.writeText(text);

          showToast("📋 Quote copied!");

        } catch {

          showToast("Unable to copy quote");

        }

      }
    );


    /* --------------------------------
       Share
    -------------------------------- */

    shareBtn.addEventListener(
      "click",
      async () => {

        if (!currentQuote) return;

        const text =
          `"${currentQuote.quote}" — ${currentQuote.author}`;


        if (navigator.share) {

          try {

            await navigator.share({
              title: "Quote of the Day",
              text: text
            });

          } catch {

            // User cancelled share
          }

        } else {

          await navigator.clipboard.writeText(text);

          showToast(
            "Sharing unavailable — quote copied!"
          );

        }

      }
    );


    /* --------------------------------
       Dark Mode
    -------------------------------- */

    themeBtn.addEventListener(
      "click",
      () => {

        document.body.classList.toggle("dark");

        const dark =
          document.body.classList.contains("dark");

        localStorage.setItem(
          "darkMode",
          dark
        );

        showToast(
          dark
            ? "🌙 Dark mode enabled"
            : "☀️ Light mode enabled"
        );

      }
    );


    /* Restore Theme */

    if (
      localStorage.getItem("darkMode") === "true"
    ) {

      document.body.classList.add("dark");

    }


    /* --------------------------------
       Refresh
    -------------------------------- */

    refreshBtn.addEventListener(
      "click",
      fetchQuote
    );


    /* --------------------------------
       Keyboard Shortcut
    -------------------------------- */

    document.addEventListener(
      "keydown",
      event => {

        if (
          event.code === "Space" &&
          event.target.tagName !== "INPUT" &&
          event.target.tagName !== "TEXTAREA"
        ) {

          event.preventDefault();

          fetchQuote();

        }

      }
    );


    /* --------------------------------
       Initial Quote
    -------------------------------- */

    fetchQuote();

  </script>

</body>
</html>
