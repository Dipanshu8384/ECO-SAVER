<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game Test</title>
    <style>
        body {
            background: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
        }
        #gameCanvas {
            border: 2px solid #60a5fa;
            background: #2d1b69;
        }
        .controls {
            color: white;
            text-align: center;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div>
        <div class="controls">
            <h2>🐍 Snake Game Test</h2>
            <p>Use arrow keys to play</p>
            <p>Score: <span id="score">0</span></p>
        </div>
        <canvas id="gameCanvas" width="800" height="600"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        
        const gridSize = 20;
        let snake = [{x: 400, y: 300}];
        let food = {x: 200, y: 200, type: 'energy'};
        let pollution = {x: 600, y: 400};
        let direction = {x: 0, y: 0};
        let score = 0;
        let gameRunning = true;

        // Generate random food
        function generateFood() {
            food = {
                x: Math.floor(Math.random() * (canvas.width / gridSize)) * gridSize,
                y: Math.floor(Math.random() * (canvas.height / gridSize)) * gridSize,
                type: Math.random() > 0.3 ? 'energy' : 'bonus'
            };
        }

        // Generate pollution
        function generatePollution() {
            pollution = {
                x: Math.floor(Math.random() * (canvas.width / gridSize)) * gridSize,
                y: Math.floor(Math.random() * (canvas.height / gridSize)) * gridSize
            };
        }

        // Handle keyboard input
        function handleKeyPress(e) {
            console.log('Key pressed:', e.key);
            if (!gameRunning) return;
            
            switch(e.key) {
                case 'ArrowUp':
                    if (direction.y === 0) direction = {x: 0, y: -gridSize};
                    break;
                case 'ArrowDown':
                    if (direction.y === 0) direction = {x: 0, y: gridSize};
                    break;
                case 'ArrowLeft':
                    if (direction.x === 0) direction = {x: -gridSize, y: 0};
                    break;
                case 'ArrowRight':
                    if (direction.x === 0) direction = {x: gridSize, y: 0};
                    break;
            }
            console.log('Direction:', direction);
            e.preventDefault();
        }

        // Draw game
        function drawGame() {
            // Clear canvas
            ctx.fillStyle = '#1a1a2e';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Show start message if not moving
            if (direction.x === 0 && direction.y === 0) {
                ctx.fillStyle = '#60a5fa';
                ctx.font = 'bold 24px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('🐍 Press Arrow Key to Start', canvas.width/2, canvas.height/2);
                ctx.fillStyle = '#ffffff';
                ctx.font = '16px Arial';
                ctx.fillText('Collect 🌱 energy, avoid 💀 pollution', canvas.width/2, canvas.height/2 + 30);
            }

            // Draw snake
            snake.forEach((segment, index) => {
                if (index === 0) {
                    ctx.fillStyle = '#10b981'; // Head
                    ctx.fillRect(segment.x, segment.y, gridSize, gridSize);
                    // Eyes
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(segment.x + 4, segment.y + 4, 4, 4);
                    ctx.fillRect(segment.x + 12, segment.y + 4, 4, 4);
                } else {
                    ctx.fillStyle = '#34d399'; // Body
                    ctx.fillRect(segment.x, segment.y, gridSize, gridSize);
                }
            });

            // Draw food
            ctx.fillStyle = food.type === 'bonus' ? '#fbbf24' : '#22c55e';
            ctx.fillRect(food.x, food.y, gridSize, gridSize);
            ctx.fillStyle = '#ffffff';
            ctx.font = '12px Arial';
            ctx.textAlign = 'center';
            ctx.fillText(food.type === 'bonus' ? '⭐' : '🌱', food.x + gridSize/2, food.y + gridSize/2 + 4);

            // Draw pollution
            ctx.fillStyle = '#ef4444';
            ctx.fillRect(pollution.x, pollution.y, gridSize, gridSize);
            ctx.fillStyle = '#ffffff';
            ctx.fillText('💀', pollution.x + gridSize/2, pollution.y + gridSize/2 + 4);
        }

        // Game loop
        function gameLoop() {
            if (!gameRunning) return;

            // Only move if direction is set
            if (direction.x === 0 && direction.y === 0) {
                drawGame();
                return;
            }

            // Move snake
            const head = {x: snake[0].x + direction.x, y: snake[0].y + direction.y};

            // Wall collision
            if (head.x < 0 || head.x >= canvas.width || head.y < 0 || head.y >= canvas.height) {
                gameRunning = false;
                alert(`Game Over! Final Score: ${score}`);
                return;
            }

            // Self collision
            if (snake.some(segment => segment.x === head.x && segment.y === head.y)) {
                gameRunning = false;
                alert(`Game Over! Final Score: ${score}`);
                return;
            }

            // Pollution collision
            if (head.x === pollution.x && head.y === pollution.y) {
                gameRunning = false;
                alert(`Game Over! Final Score: ${score}`);
                return;
            }

            snake.unshift(head);

            // Food collision
            if (head.x === food.x && head.y === food.y) {
                if (food.type === 'bonus') {
                    score += 50;
                } else {
                    score += 10;
                }
                scoreElement.textContent = score;
                generateFood();
                generatePollution();
            } else {
                snake.pop();
            }

            drawGame();
        }

        // Initialize
        document.addEventListener('keydown', handleKeyPress);
        generateFood();
        generatePollution();
        drawGame();
        
        // Start game loop
        setInterval(gameLoop, 120);
        
        console.log('Snake game initialized!');
    </script>
</body>
</html>
