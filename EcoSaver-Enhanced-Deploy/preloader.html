<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
           /* Preloader Styles */
        .preloader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--gradient-sky);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }
</style>
<body>
     <!-- Preloader -->
    <div id="preloader" class="preloader">
        <div class="flex flex-col items-center justify-center space-y-6">
            <!-- Animated Tree -->
            <div class="relative">
                <svg class="icon-xl text-primary tree-grow" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M12 2L13.5 8H18L12 12L13.5 18H10.5L12 12L6 8H10.5L12 2Z M8 19H16V21H8V19Z"/>
                </svg>
                <svg class="icon absolute -top-2 -right-2 text-secondary" style="animation: pulse 2s infinite;" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M17,8C8,10 5.9,16.17 3.82,21.34L5.71,22L6.66,19.7C7.14,19.87 7.64,20 8,20C19,20 22,3 22,3C21,5 14,5.25 9,6.25C4,7.25 2,11.5 2,13.5C2,15.5 3.75,17.25 3.75,17.25C7,8 17,8 17,8Z"/>
                </svg>
            </div>
            
            <!-- Loading Text -->
            <div class="text-center">
                <h3 class="font-display text-2xl font-bold text-primary mb-4">
                    EcoSaver
                </h3>
                <p class="text-lg text-muted-foreground" style="animation: pulse 2s infinite;">
                    Growing sustainable futures...
                </p>
            </div>

            <!-- Progress Bar -->
            <div style="width: 16rem; background-color: rgba(255,255,255,0.2); border-radius: 9999px; height: 0.5rem; overflow: hidden;">
                <div style="height: 100%; background: var(--gradient-hero); border-radius: 9999px; animation: progress 2s ease-out forwards;"></div>
            </div>
        </div>
    </div>
    
</body>
<script
// Navigation functions
        function showPage(pageId) {
            // Hide all pages
            const pages = document.querySelectorAll('.page');
            pages.forEach(page => {
                page.classList.add('hidden');
            });
            
            // Show selected page
            const targetPage = document.getElementById(pageId);
            if (targetPage) {
                targetPage.classList.remove('hidden');
            }

            // Update navigation active state
            updateNavigation(pageId);
        }

</script>
        
</html>
