<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoSaver - Ultra Holographic Interface</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            background: #000;
            color: white;
            cursor: none;
        }

        /* Ultra Realistic Holographic Environment */
        .holo-environment {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 20%, rgba(120, 119, 198, 0.3) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(255, 119, 198, 0.3) 0%, transparent 50%),
                radial-gradient(circle at 40% 70%, rgba(88, 199, 250, 0.4) 0%, transparent 50%),
                radial-gradient(ellipse at center, #0a0a0a 0%, #000000 100%);
            z-index: -100;
        }

        /* Advanced Particle System */
        .particle-system {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .particle {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
        }

        .particle.glow {
            box-shadow: 0 0 20px currentColor, 0 0 40px currentColor, 0 0 60px currentColor;
        }

        /* Neural Network Lines */
        .neural-network {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        /* Custom Cursor */
        .custom-cursor {
            position: fixed;
            width: 20px;
            height: 20px;
            background: radial-gradient(circle, #60a5fa 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 10000;
            transition: transform 0.1s ease;
            box-shadow: 0 0 20px #60a5fa, 0 0 40px #60a5fa;
        }

        /* Holographic UI Container */
        .holo-ui {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            perspective: 2000px;
            transform-style: preserve-3d;
        }

        /* Central Hologram */
        .central-holo {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 600px;
            height: 400px;
            background: 
                linear-gradient(135deg, rgba(96, 165, 250, 0.1) 0%, rgba(52, 211, 153, 0.1) 100%),
                radial-gradient(circle at center, rgba(255, 255, 255, 0.05) 0%, transparent 70%);
            backdrop-filter: blur(30px);
            border-radius: 20px;
            border: 2px solid transparent;
            background-clip: padding-box;
            position: relative;
            animation: holoFloat 4s ease-in-out infinite;
            box-shadow: 
                0 0 100px rgba(96, 165, 250, 0.3),
                inset 0 0 100px rgba(255, 255, 255, 0.02),
                0 0 0 1px rgba(96, 165, 250, 0.2);
        }

        @keyframes holoFloat {
            0%, 100% { transform: translate(-50%, -50%) rotateY(0deg) translateZ(0); }
            50% { transform: translate(-50%, -50%) rotateY(2deg) translateZ(20px); }
        }

        /* Holographic Border Animation */
        .central-holo::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(45deg, #60a5fa, #34d399, #fbbf24, #f87171, #60a5fa);
            border-radius: 20px;
            z-index: -1;
            animation: borderRotate 3s linear infinite;
            background-size: 400% 400%;
        }

        @keyframes borderRotate {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Content Inside Central Holo */
        .holo-content {
            position: relative;
            z-index: 2;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 2rem;
        }

        .holo-title {
            font-size: 3.5rem;
            font-weight: 100;
            margin-bottom: 1rem;
            background: linear-gradient(45deg, #60a5fa, #34d399, #fbbf24);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: titleGlow 2s ease-in-out infinite alternate;
            letter-spacing: 3px;
        }

        @keyframes titleGlow {
            0% { text-shadow: 0 0 20px rgba(96, 165, 250, 0.5); }
            100% { text-shadow: 0 0 40px rgba(96, 165, 250, 0.8); }
        }

        .holo-subtitle {
            font-size: 1.2rem;
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 2rem;
            animation: subtitlePulse 3s ease-in-out infinite;
        }

        @keyframes subtitlePulse {
            0%, 100% { opacity: 0.8; }
            50% { opacity: 1; }
        }

        /* Orbiting Feature Panels */
        .feature-orbit {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 1200px;
            height: 1200px;
            transform: translate(-50%, -50%);
            animation: orbitRotate 20s linear infinite;
        }

        @keyframes orbitRotate {
            0% { transform: translate(-50%, -50%) rotateZ(0deg); }
            100% { transform: translate(-50%, -50%) rotateZ(360deg); }
        }

        .feature-panel {
            position: absolute;
            width: 200px;
            height: 120px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            animation: panelFloat 3s ease-in-out infinite;
        }

        @keyframes panelFloat {
            0%, 100% { transform: translateZ(0) rotateZ(0deg); }
            50% { transform: translateZ(30px) rotateZ(180deg); }
        }

        .feature-panel:hover {
            transform: scale(1.2) translateZ(50px);
            background: rgba(96, 165, 250, 0.2);
            box-shadow: 0 0 50px rgba(96, 165, 250, 0.5);
        }

        /* Positioning Feature Panels */
        .feature-panel:nth-child(1) { 
            top: 50px; 
            left: 50%;
            transform: translateX(-50%);
            animation-delay: 0s;
        }
        .feature-panel:nth-child(2) { 
            top: 150px; 
            right: 100px;
            animation-delay: 0.5s;
        }
        .feature-panel:nth-child(3) { 
            top: 50%;
            right: 50px;
            transform: translateY(-50%);
            animation-delay: 1s;
        }
        .feature-panel:nth-child(4) { 
            bottom: 150px; 
            right: 100px;
            animation-delay: 1.5s;
        }
        .feature-panel:nth-child(5) { 
            bottom: 50px; 
            left: 50%;
            transform: translateX(-50%);
            animation-delay: 2s;
        }
        .feature-panel:nth-child(6) { 
            bottom: 150px; 
            left: 100px;
            animation-delay: 2.5s;
        }
        .feature-panel:nth-child(7) { 
            top: 50%;
            left: 50px;
            transform: translateY(-50%);
            animation-delay: 3s;
        }
        .feature-panel:nth-child(8) { 
            top: 150px; 
            left: 100px;
            animation-delay: 3.5s;
        }

        .feature-text {
            font-size: 0.9rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.9);
            text-align: center;
        }

        /* Holographic Data Streams */
        .data-stream {
            position: absolute;
            width: 2px;
            background: linear-gradient(to bottom, transparent, #60a5fa, transparent);
            animation: dataFlow 2s linear infinite;
            opacity: 0.7;
        }

        @keyframes dataFlow {
            0% { height: 0; transform: translateY(0); }
            50% { height: 100px; }
            100% { height: 0; transform: translateY(100vh); }
        }

        /* Interactive Holographic Grid */
        .holo-grid {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(96, 165, 250, 0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(96, 165, 250, 0.1) 1px, transparent 1px);
            background-size: 50px 50px;
            pointer-events: none;
            opacity: 0.3;
            animation: gridPulse 4s ease-in-out infinite;
        }

        @keyframes gridPulse {
            0%, 100% { opacity: 0.1; }
            50% { opacity: 0.3; }
        }

        /* Navigation Hologram */
        .nav-holo {
            position: fixed;
            top: 2rem;
            left: 2rem;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 1rem;
            z-index: 100;
        }

        .nav-item {
            display: block;
            color: rgba(255, 255, 255, 0.7);
            text-decoration: none;
            padding: 0.5rem 1rem;
            margin: 0.25rem 0;
            border-radius: 8px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .nav-item::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(96, 165, 250, 0.2), transparent);
            transition: left 0.5s;
        }

        .nav-item:hover {
            color: #60a5fa;
            transform: translateX(5px);
        }

        .nav-item:hover::before {
            left: 100%;
        }

        /* Status Hologram */
        .status-holo {
            position: fixed;
            top: 2rem;
            right: 2rem;
            display: flex;
            gap: 1rem;
            z-index: 100;
        }

        .status-item {
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 25px;
            padding: 0.75rem 1.5rem;
            color: white;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .status-item:hover {
            background: rgba(96, 165, 250, 0.2);
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(96, 165, 250, 0.3);
        }

        /* Audio Visualizer */
        .audio-visualizer {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 2px;
            z-index: 100;
        }

        .audio-bar {
            width: 4px;
            background: linear-gradient(to top, #60a5fa, #34d399);
            border-radius: 2px;
            animation: audioViz 1s ease-in-out infinite;
        }

        @keyframes audioViz {
            0%, 100% { height: 10px; }
            50% { height: 30px; }
        }

        /* Generate unique delays for audio bars */
        .audio-bar:nth-child(1) { animation-delay: 0s; }
        .audio-bar:nth-child(2) { animation-delay: 0.1s; }
        .audio-bar:nth-child(3) { animation-delay: 0.2s; }
        .audio-bar:nth-child(4) { animation-delay: 0.3s; }
        .audio-bar:nth-child(5) { animation-delay: 0.4s; }
        .audio-bar:nth-child(6) { animation-delay: 0.3s; }
        .audio-bar:nth-child(7) { animation-delay: 0.2s; }
        .audio-bar:nth-child(8) { animation-delay: 0.1s; }

        /* Responsive Design */
        @media (max-width: 768px) {
            .central-holo {
                width: 90vw;
                height: 60vh;
            }
            
            .holo-title {
                font-size: 2rem;
            }
            
            .feature-orbit {
                width: 100vw;
                height: 100vh;
            }
            
            .nav-holo {
                display: none;
            }
        }
    </style>
</head>
<body>
    <!-- Holographic Environment -->
    <div class="holo-environment"></div>
    <div class="holo-grid"></div>
    
    <!-- Advanced Particle System -->
    <div class="particle-system" id="particleSystem"></div>
    
    <!-- Neural Network Canvas -->
    <canvas class="neural-network" id="neuralCanvas"></canvas>
    
    <!-- Custom Cursor -->
    <div class="custom-cursor" id="customCursor"></div>
    
    <!-- Navigation Hologram -->
    <div class="nav-holo">
        <div style="color: #60a5fa; font-weight: bold; margin-bottom: 1rem; font-size: 1.1rem;">ECOSAVER</div>
        <a href="#" class="nav-item" data-feature="dashboard">DASHBOARD</a>
        <a href="#" class="nav-item" data-feature="carbon">CARBON TRACKER</a>
        <a href="#" class="nav-item" data-feature="games">ECO GAMES</a>
        <a href="#" class="nav-item" data-feature="library">LIBRARY</a>
        <a href="#" class="nav-item" data-feature="community">COMMUNITY</a>
        <a href="#" class="nav-item" data-feature="habits">HABITS</a>
        <a href="#" class="nav-item" data-feature="analytics">ANALYTICS</a>
    </div>
    
    <!-- Status Hologram -->
    <div class="status-holo">
        <div class="status-item">SYSTEM ACTIVE</div>
        <div class="status-item">LOGIN</div>
        <div class="status-item">CONTACT</div>
    </div>
    
    <!-- Main Holographic UI -->
    <div class="holo-ui">
        
        <!-- Central Hologram -->
        <div class="central-holo">
            <div class="holo-content">
                <h1 class="holo-title">ECOSAVER</h1>
                <p class="holo-subtitle">NEXT-GENERATION ENVIRONMENTAL INTELLIGENCE</p>
                <div style="display: flex; gap: 1rem; margin-top: 2rem;">
                    <button class="status-item" onclick="activateSystem()" style="border: none; background: linear-gradient(45deg, #60a5fa, #34d399); cursor: pointer;">
                        INITIALIZE SYSTEM
                    </button>
                </div>
            </div>
        </div>
        
        <!-- Orbiting Feature Panels -->
        <div class="feature-orbit">
            <div class="feature-panel" onclick="openFeature('dashboard.html')">
                <div class="feature-text">DASHBOARD<br>CONTROL</div>
            </div>
            <div class="feature-panel" onclick="openFeature('carbon-footprint-tracker.html')">
                <div class="feature-text">CARBON<br>TRACKING</div>
            </div>
            <div class="feature-panel" onclick="openFeature('games-hub.html')">
                <div class="feature-text">ECO<br>GAMES</div>
            </div>
            <div class="feature-panel" onclick="openFeature('educational-library.html')">
                <div class="feature-text">KNOWLEDGE<br>BASE</div>
            </div>
            <div class="feature-panel" onclick="openFeature('community-action.html')">
                <div class="feature-text">COMMUNITY<br>NETWORK</div>
            </div>
            <div class="feature-panel" onclick="openFeature('eco-habit-tracking.html')">
                <div class="feature-text">HABIT<br>TRACKER</div>
            </div>
            <div class="feature-panel" onclick="openFeature('ecotracker.html')">
                <div class="feature-text">ANALYTICS<br>ENGINE</div>
            </div>
            <div class="feature-panel" onclick="openFeature('local-ecological-issues.html')">
                <div class="feature-text">LOCAL<br>ISSUES</div>
            </div>
        </div>
        
    </div>
    
    <!-- Audio Visualizer -->
    <div class="audio-visualizer">
        <div class="audio-bar"></div>
        <div class="audio-bar"></div>
        <div class="audio-bar"></div>
        <div class="audio-bar"></div>
        <div class="audio-bar"></div>
        <div class="audio-bar"></div>
        <div class="audio-bar"></div>
        <div class="audio-bar"></div>
        <div class="audio-bar"></div>
        <div class="audio-bar"></div>
        <div class="audio-bar"></div>
        <div class="audio-bar"></div>
    </div>
    
    <!-- Data Streams -->
    <div class="data-stream" style="left: 10%; animation-delay: 0s;"></div>
    <div class="data-stream" style="left: 30%; animation-delay: 1s;"></div>
    <div class="data-stream" style="left: 60%; animation-delay: 2s;"></div>
    <div class="data-stream" style="left: 85%; animation-delay: 1.5s;"></div>

    <script>
        // Custom Cursor
        const cursor = document.getElementById('customCursor');
        document.addEventListener('mousemove', (e) => {
            cursor.style.left = e.clientX + 'px';
            cursor.style.top = e.clientY + 'px';
        });

        // Advanced Particle System
        function createAdvancedParticles() {
            const container = document.getElementById('particleSystem');
            
            for (let i = 0; i < 100; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                
                // Random properties
                const size = Math.random() * 6 + 2;
                const x = Math.random() * window.innerWidth;
                const y = Math.random() * window.innerHeight;
                const colors = ['#60a5fa', '#34d399', '#fbbf24', '#f87171', '#a78bfa'];
                const color = colors[Math.floor(Math.random() * colors.length)];
                
                particle.style.width = size + 'px';
                particle.style.height = size + 'px';
                particle.style.left = x + 'px';
                particle.style.top = y + 'px';
                particle.style.background = color;
                particle.style.opacity = Math.random() * 0.8 + 0.2;
                
                // Add glow effect to some particles
                if (Math.random() > 0.7) {
                    particle.classList.add('glow');
                }
                
                // Animate particle
                const duration = Math.random() * 10 + 5;
                const delay = Math.random() * 5;
                
                particle.style.animation = `
                    float ${duration}s ease-in-out infinite ${delay}s,
                    particleGlow ${duration/2}s ease-in-out infinite ${delay}s
                `;
                
                container.appendChild(particle);
                
                // Animate particle movement
                setInterval(() => {
                    const newX = Math.random() * window.innerWidth;
                    const newY = Math.random() * window.innerHeight;
                    particle.style.transition = 'all 3s ease';
                    particle.style.left = newX + 'px';
                    particle.style.top = newY + 'px';
                }, Math.random() * 10000 + 5000);
            }
        }

        // Neural Network Animation
        function createNeuralNetwork() {
            const canvas = document.getElementById('neuralCanvas');
            const ctx = canvas.getContext('2d');
            
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            
            const nodes = [];
            const connections = [];
            
            // Create nodes
            for (let i = 0; i < 50; i++) {
                nodes.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    vx: (Math.random() - 0.5) * 0.5,
                    vy: (Math.random() - 0.5) * 0.5,
                    radius: Math.random() * 3 + 1,
                    opacity: Math.random() * 0.5 + 0.2
                });
            }
            
            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                // Update and draw nodes
                nodes.forEach((node, i) => {
                    node.x += node.vx;
                    node.y += node.vy;
                    
                    // Bounce off edges
                    if (node.x < 0 || node.x > canvas.width) node.vx *= -1;
                    if (node.y < 0 || node.y > canvas.height) node.vy *= -1;
                    
                    // Draw node
                    ctx.beginPath();
                    ctx.arc(node.x, node.y, node.radius, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(96, 165, 250, ${node.opacity})`;
                    ctx.fill();
                    
                    // Draw connections
                    nodes.forEach((otherNode, j) => {
                        if (i !== j) {
                            const distance = Math.sqrt(
                                Math.pow(node.x - otherNode.x, 2) + 
                                Math.pow(node.y - otherNode.y, 2)
                            );
                            
                            if (distance < 100) {
                                ctx.beginPath();
                                ctx.moveTo(node.x, node.y);
                                ctx.lineTo(otherNode.x, otherNode.y);
                                const opacity = (100 - distance) / 100 * 0.2;
                                ctx.strokeStyle = `rgba(96, 165, 250, ${opacity})`;
                                ctx.stroke();
                            }
                        }
                    });
                });
                
                requestAnimationFrame(animate);
            }
            
            animate();
        }

        // Interactive Features
        function activateSystem() {
            // Add system activation effects
            document.body.style.animation = 'none';
            document.body.style.filter = 'brightness(1.2)';
            
            // Show activation message
            const message = document.createElement('div');
            message.style.position = 'fixed';
            message.style.top = '50%';
            message.style.left = '50%';
            message.style.transform = 'translate(-50%, -50%)';
            message.style.color = '#34d399';
            message.style.fontSize = '2rem';
            message.style.fontWeight = 'bold';
            message.style.zIndex = '10000';
            message.style.animation = 'titleGlow 1s ease-in-out';
            message.textContent = 'SYSTEM ACTIVATED';
            
            document.body.appendChild(message);
            
            setTimeout(() => {
                message.remove();
                document.body.style.filter = 'none';
            }, 2000);
        }

        function openFeature(url) {
            // Add transition effect
            document.body.style.transition = 'opacity 0.5s ease';
            document.body.style.opacity = '0.3';
            
            setTimeout(() => {
                window.location.href = url;
            }, 500);
        }

        // Navigation interactions
        document.querySelectorAll('.nav-item').forEach(item => {
            item.addEventListener('mouseenter', () => {
                cursor.style.transform = 'scale(2)';
                cursor.style.background = 'radial-gradient(circle, #34d399 0%, transparent 70%)';
            });
            
            item.addEventListener('mouseleave', () => {
                cursor.style.transform = 'scale(1)';
                cursor.style.background = 'radial-gradient(circle, #60a5fa 0%, transparent 70%)';
            });
        });

        // Feature panel interactions
        document.querySelectorAll('.feature-panel').forEach(panel => {
            panel.addEventListener('mouseenter', () => {
                cursor.style.transform = 'scale(3)';
                cursor.style.background = 'radial-gradient(circle, #fbbf24 0%, transparent 70%)';
                
                // Add panel activation sound effect (visual)
                panel.style.boxShadow = '0 0 100px rgba(96, 165, 250, 0.8)';
            });
            
            panel.addEventListener('mouseleave', () => {
                cursor.style.transform = 'scale(1)';
                cursor.style.background = 'radial-gradient(circle, #60a5fa 0%, transparent 70%)';
                panel.style.boxShadow = '';
            });
        });

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            switch(e.key) {
                case '1': openFeature('dashboard.html'); break;
                case '2': openFeature('carbon-footprint-tracker.html'); break;
                case '3': openFeature('games-hub.html'); break;
                case '4': openFeature('educational-library.html'); break;
                case '5': openFeature('community-action.html'); break;
                case '6': openFeature('eco-habit-tracking.html'); break;
                case '7': openFeature('ecotracker.html'); break;
                case 'Enter': activateSystem(); break;
            }
        });

        // Add dynamic CSS animations
        const style = document.createElement('style');
        style.textContent = `
            @keyframes particleGlow {
                0%, 100% { box-shadow: 0 0 10px currentColor; }
                50% { box-shadow: 0 0 30px currentColor, 0 0 50px currentColor; }
            }
        `;
        document.head.appendChild(style);

        // Initialize everything
        document.addEventListener('DOMContentLoaded', () => {
            createAdvancedParticles();
            createNeuralNetwork();
            
            // Add entrance animation
            document.body.style.opacity = '0';
            setTimeout(() => {
                document.body.style.transition = 'opacity 2s ease';
                document.body.style.opacity = '1';
            }, 100);
        });

        // Responsive resize handling
        window.addEventListener('resize', () => {
            const canvas = document.getElementById('neuralCanvas');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        // Add holographic screen effect
        setInterval(() => {
            const glitch = document.createElement('div');
            glitch.style.position = 'fixed';
            glitch.style.top = '0';
            glitch.style.left = '0';
            glitch.style.width = '100%';
            glitch.style.height = '100%';
            glitch.style.background = 'linear-gradient(90deg, transparent 98%, rgba(96, 165, 250, 0.03) 100%)';
            glitch.style.pointerEvents = 'none';
            glitch.style.zIndex = '9999';
            glitch.style.animation = 'none';
            
            document.body.appendChild(glitch);
            
            setTimeout(() => {
                glitch.remove();
            }, 100);
        }, Math.random() * 10000 + 5000);
    </script>
</body>
</html>
